        body {
            background-color: #050810;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;

        /* Neural Background Effect */
        .neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(0, 218, 243, 0.05) 0%, transparent 60%),

            overflow: hidden;
        }

        .node {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #00daf3;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(0, 218, 243, 0.5);
            animation: pulse 4s infinite alternate;
        }

        .line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,218,243,0) 0%, rgba(0,218,243,0.2) 50%, rgba(0,218,243,0) 100%);

            opacity: 0.5;

            0% { transform: scale(1); opacity: 0.3; }

        document.addEventListener('DOMContentLoaded', () => {

                node.style.top = `${Math.random() * 100}vh`;
                node.style.animationDelay = `${Math.random() * 2}s`;
                canvas.appendChild(node);
                nodes.push(node);
            }

            // Create random lines between nodes
            for (let i = 0; i < 15; i++) {
                const n1 = nodes[Math.floor(Math.random() * nodes.length)];
                const n2 = nodes[Math.floor(Math.random() * nodes.length)];
                
                const line = document.createElement('div');
                line.className = 'line';
                
                // Extremely simplified line placement just for visual flavor
                line.style.left = n1.style.left;
                line.style.top = n1.style.top;
                line.style.width = `${Math.random() * 200 + 50}px`;
                line.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                canvas.appendChild(line);
            }
        });

<script>
// ── State ──────────────────────────────────────────────────────────────────
const API = 'http://localhost:8000';
let token = localStorage.getItem('hjai_token') || '';
let user = JSON.parse(localStorage.getItem('hjai_user') || '{"name":"User","email":""}');
let sessionId = null;
let turnCount = 0;
let chatHistory = []; // local message log for current session

// ── Init ───────────────────────────────────────────────────────────────────
(function init() {
  // Populate user info
  const name = user.name || 'User';
  const initial = name.charAt(0).toUpperCase();
  document.getElementById('userInitial').textContent = initial;
  document.getElementById('sidebarInitial').textContent = initial;
  document.getElementById('sidebarName').textContent = name;
  document.getElementById('settingsInitial').textContent = initial;
  document.getElementById('settingsName').textContent = name;
  document.getElementById('settingsEmail').textContent = user.email || '';
})();

// ── Panel Toggle ───────────────────────────────────────────────────────────
function togglePanel(which) {}

function closePanels() {}

// ── Load History from API ──────────────────────────────────────────────────
async function loadHistory() {
  const loading = document.getElementById('historyLoading');
  const empty = document.getElementById('historyEmpty');
  const items = document.getElementById('historyItems');
  loading.style.display = 'flex';
  empty.style.display = 'none';
  items.innerHTML = '';

  // Pull from localStorage history (persisted across sessions)
  const stored = JSON.parse(localStorage.getItem('hjai_chat_history') || '[]');

  // Also try fetching from backend
  let backendSessions = [];
  try {
    const resp = await fetch(`${API}/api/chat/sessions`, {
      headers: token ? { 'Authorization': `Bearer ${token}` } : {}
    });
    if (resp.ok) {
      backendSessions = await resp.json();
    }
  } catch(e) { /* offline — use local */ }

  loading.style.display = 'none';

  // Merge: backend sessions + local stored history
  const allHistory = [
    ...backendSessions.map(s => ({
      id: s.id || s.session_id,
      title: s.title || s.first_message || 'Chat Session',
      preview: s.preview || s.last_message || '',
      timestamp: s.created_at || s.timestamp || new Date().toISOString(),
      source: 'server'
    })),
    ...stored
  ];

  if (allHistory.length === 0) {
    empty.style.display = 'block';
    return;
  }

  // Render sorted by newest first
  allHistory.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  allHistory.forEach(session => {
    const div = document.createElement('div');
    div.className = 'text-on-surface-variant px-4 py-3 hover:bg-surface-variant/30 flex flex-col gap-1 hover:bg-surface-container-high transition-all duration-200 cursor-pointer rounded-lg';
    const ts = new Date(session.timestamp);
    const relTime = formatRelTime(ts);
    div.innerHTML = `
      <div class="title">${escHtml(session.title)}</div>
      <div class="meta">${relTime}${session.preview ? ' · ' + escHtml(session.preview.substring(0,50)) + '…' : ''}</div>
    `;
    div.onclick = () => loadSession(session);
    items.appendChild(div);
  });
}

function formatRelTime(date) {
  const diff = Date.now() - date.getTime();
  const mins = Math.floor(diff/60000);
  const hrs = Math.floor(diff/3600000);
  const days = Math.floor(diff/86400000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${mins}m ago`;
  if (hrs < 24) return `${hrs}h ago`;
  if (days < 7) return `${days}d ago`;
  return date.toLocaleDateString();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function loadSession(session) {
  closePanels();
  // If session has messages, display them
  const area = document.getElementById('messagesArea');
  document.getElementById('welcomeState').remove();
  area.innerHTML = '';
  chatTitle.textContent = session.title;
  if (session.messages && session.messages.length) {
    session.messages.forEach(m => {
      if (m.role === 'user') appendUserMsg(m.content);
      else appendAIMsg(m.content);
    });
  } else {
    const note = document.createElement('div');
    note.style.cssText = 'text-align:center;color:#8d90a0;font-size:13px;padding:20px;';
    note.textContent = `Loaded: "${session.title}"`;
    area.appendChild(note);
  }
}

// ── Clear History ──────────────────────────────────────────────────────────
function clearHistory() {
  if (!confirm('Clear all local chat history? This cannot be undone.')) return;
  localStorage.removeItem('hjai_chat_history');
  document.getElementById('historyItems').innerHTML = '';
  document.getElementById('historyEmpty').style.display = 'block';
}

// ── Save Session to Local History ─────────────────────────────────────────
function saveToLocalHistory(title, messages) {
  const stored = JSON.parse(localStorage.getItem('hjai_chat_history') || '[]');
  const existing = stored.findIndex(s => s.id === sessionId);
  const entry = {
    id: sessionId || ('local_' + Date.now()),
    title,
    preview: messages[0]?.content || '',
    timestamp: new Date().toISOString(),
    messages,
    source: 'local'
  };
  if (existing >= 0) stored[existing] = entry;
  else stored.unshift(entry);
  localStorage.setItem('hjai_chat_history', JSON.stringify(stored.slice(0, 50)));
}

// ── Chat ───────────────────────────────────────────────────────────────────
let chatMessages = [];

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  // Hide welcome state
  const ws = document.getElementById('welcomeState');
  if (ws) ws.remove();

  input.value = '';
  input.style.height = '40px';

  appendUserMsg(text);
  chatMessages.push({ role: 'user', content: text });
  turnCount++;
  updateTurnCount();

  removeThinking(appendThinking()); // show briefly then replace with streaming bubble

  // Create the AI bubble immediately (will be filled by stream)
  const bubbleId = 'ai_bubble_' + Date.now();
  const area = document.getElementById('messagesArea');
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:flex;justify-content:flex-start;';
  wrapper.innerHTML = `<div class="self-start w-full max-w-[95%] glass-panel rounded-2xl rounded-tl-sm p-5 border border-surface-tint/30 flex flex-col gap-4">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
      <span class="material-symbols-outlined" style="font-size:16px;color:#b4c5ff;font-variation-settings:'FILL' 1;">psychology</span>
      <span style="font-size:11px;color:#b4c5ff;letter-spacing:0.05em;text-transform:uppercase;font-weight:600;">Neural Engine</span>
      <span id="${bubbleId}_spin" class="animate-spin material-symbols-outlined" style="font-size:14px;color:#2563eb;">autorenew</span>
    </div>
    <div id="${bubbleId}" style="white-space:pre-wrap;word-break:break-word;min-height:20px;"></div>
  </div>`;
  area.appendChild(wrapper);
  area.scrollTop = area.scrollHeight;

  const userId = (user && (user.email || user.name)) ? (user.email || user.name) : 'guest';
  if (!sessionId) sessionId = 'session_' + Date.now();

  try {
    const resp = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
      },
      body: JSON.stringify({
        user_id: userId,
        message: text,
        session_id: sessionId
      })
    });

    // Remove spinner
    const spinner = document.getElementById(bubbleId + '_spin');
    if (spinner) spinner.remove();

    if (!resp.ok) {
      let errDetail = `${resp.status} ${resp.statusText}`;
      try { const e = await resp.json(); errDetail = e.detail || e.message || errDetail; } catch(_){}
      const b = document.getElementById(bubbleId);
      if (b) b.innerHTML = `<span style="color:#ffb4ab;">⚠️ ${escHtml(errDetail)}</span>`;
      return;
    }

    const contentType = resp.headers.get('content-type') || '';
    const bubble = document.getElementById(bubbleId);
    let fullText = '';

    if (resp.body && (contentType.includes('text/plain') || contentType.includes('text/event-stream') || !contentType.includes('application/json'))) {
      // Streaming text response
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        fullText += decoder.decode(value, { stream: true });
        if (bubble) bubble.innerHTML = formatMarkdown(fullText);
        area.scrollTop = area.scrollHeight;
      }
    } else {
      // JSON response fallback
      const data = await resp.json();
      fullText = data.response || data.message || data.content || data.answer || '';
      if (!fullText) fullText = JSON.stringify(data, null, 2);
      if (data.session_id) sessionId = data.session_id;
      if (bubble) bubble.innerHTML = formatMarkdown(fullText);
    }

    chatMessages.push({ role: 'assistant', content: fullText });
    saveToLocalHistory(text.substring(0, 50) + (text.length > 50 ? '…' : ''), chatMessages);
    area.scrollTop = area.scrollHeight;

  } catch(e) {
    const spinner = document.getElementById(bubbleId + '_spin');
    if (spinner) spinner.remove();
    const b = document.getElementById(bubbleId);
    if (b) b.innerHTML = `<span style="color:#ffb4ab;">⚠️ Cannot reach backend.<br/><code style="font-size:12px;color:#8d90a0;">${escHtml(e.message)}</code></span>`;
  }
}

function formatMarkdown(text) {
  return escHtml(text)
    .replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,0.4);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;border:1px solid rgba(255,255,255,0.08);margin:8px 0;font-family:monospace;white-space:pre-wrap;">$1</pre>')
    .replace(/`([^`\n]+)`/g, '<code style="background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px;">$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#fff;">$1</strong>')
    .replace(/\*(.+?)\*/g, '<em style="color:#c3c6d7;">$1</em>')
    .replace(/\n/g, '<br/>');
}

function updateTurnCount() {
  document.getElementById('turnCount').textContent = `${turnCount} turn${turnCount !== 1 ? 's' : ''}`;
  document.getElementById('footerTurns').textContent = `Session: ${turnCount} turn${turnCount !== 1 ? 's' : ''}`;
}

// ── New Session ────────────────────────────────────────────────────────────

  sessionId = null;
  turnCount = 0;
  chatMessages = [];
  updateTurnCount();
  document.getElementById('chatTitle').textContent = 'Neural Engine';
  const area = document.getElementById('messagesArea');
  area.innerHTML = `<div id="welcomeState" class="flex flex-col items-center justify-center h-full text-center gap-6">
    <div class="w-16 h-16 rounded-full bg-surface-tint/10 border border-surface-tint/30 flex items-center justify-center">
      <span class="material-symbols-outlined text-4xl text-surface-tint">psychology</span>
    </div>
    <div>
      <p class="text-xl font-headline-lg font-bold text-on-surface m-0">Neural Session Started</p>
      <p class="text-sm font-technical-sm text-muted-steel mt-2">Standing by for input sequence.</p>
    </div>
  </div>`;
}

// ── File Attach ────────────────────────────────────────────────────────────
function handleFileAttach(input) {
  const file = input.files[0];
  if (!file) return;
  const chat = document.getElementById('chatInput');
  chat.value = `[Attached: ${file.name}] `;
  chat.focus();
  input.value = '';
}

// ── Toggle 3D Viz ──────────────────────────────────────────────────────────
function toggleViz(on) {
  const viz = document.getElementById('threejs-container-ANIMATION_8');
  if (viz) viz.parentElement.style.opacity = on ? '0.85' : '0';
}

// ── Sign Out ───────────────────────────────────────────────────────────────
function signOut() {
  localStorage.removeItem('hjai_token');
  localStorage.removeItem('hjai_user');
  window.top.location.href = '/login';
}
