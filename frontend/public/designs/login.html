<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 100;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const neuronCount = 40;
  const neuronGeometry = new THREE.SphereGeometry(0.8, 16, 16);
  const neuronMaterial = new THREE.MeshPhongMaterial({
      color: 0x2563eb, emissive: 0x2563eb,
      emissiveIntensity: 2, transparent: true, opacity: 0.9
  });

  const neurons = [];
  const group = new THREE.Group();

  for (let i = 0; i < neuronCount; i++) {
      const neuron = new THREE.Mesh(neuronGeometry, neuronMaterial.clone());
      neuron.position.set(
          (Math.random() - 0.5) * 150,
          (Math.random() - 0.5) * 100,
          (Math.random() - 0.5) * 100
      );
      neuron.userData.originalPos = neuron.position.clone();
      neuron.userData.pulseOffset = Math.random() * Math.PI * 2;
      group.add(neuron);
      neurons.push(neuron);
  }

  const lineMaterial = new THREE.LineBasicMaterial({ color: 0x2563eb, transparent: true, opacity: 0.15 });
  const maxDistance = 45;
  const lines = [];

  const updateConnections = () => {
      lines.forEach(l => group.remove(l));
      lines.length = 0;
      for (let i = 0; i < neurons.length; i++) {
          for (let j = i + 1; j < neurons.length; j++) {
              const dist = neurons[i].position.distanceTo(neurons[j].position);
              if (dist < maxDistance) {
                  const geometry = new THREE.BufferGeometry().setFromPoints([neurons[i].position, neurons[j].position]);
                  const line = new THREE.Line(geometry, lineMaterial);
                  group.add(line); lines.push(line);
              }
          }
      }
  };

  scene.add(group);
  scene.add(new THREE.AmbientLight(0xffffff, 0.2));
  const pointLight = new THREE.PointLight(0x2563eb, 1.5, 300);
  pointLight.position.set(50, 50, 50);
  scene.add(pointLight);

  const animate = () => {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;
      neurons.forEach(n => {
          n.position.y = n.userData.originalPos.y + Math.sin(time + n.userData.pulseOffset) * 5;
          n.position.x = n.userData.originalPos.x + Math.cos(time + n.userData.pulseOffset) * 3;
          const pulse = (Math.sin(time * 2 + n.userData.pulseOffset) + 1) / 2;
          n.material.emissiveIntensity = 1 + pulse * 3;
          n.scale.setScalar(1 + pulse * 0.2);
      });
      updateConnections();
      group.rotation.y += 0.001;
      group.rotation.x += 0.0005;
      renderer.render(scene, camera);
  };
  animate();

  window.addEventListener('resize', () => {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
  });
})();
</script>

<script>
function togglePassword() {
  const pw = document.getElementById('passwordInput');
  const icon = document.getElementById('eyeIcon');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    pw.type = 'password';
    icon.textContent = 'visibility';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('emailInput').value;
  const password = document.getElementById('passwordInput').value;
  const errorMsg = document.getElementById('errorMsg');
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');
  const btnSpinner = document.getElementById('btnSpinner');

  // Loading state
  errorMsg.style.display = 'none';
  btn.classList.add('btn-loading');
  btnText.textContent = 'Connecting...';
  btnIcon.style.display = 'none';
  btnSpinner.style.display = 'inline';

  try {
    const resp = await fetch('http://localhost:8000/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await resp.json();

    if (resp.ok && data.access_token) {
      // Store token and redirect
      localStorage.setItem('hjai_token', data.access_token);
      localStorage.setItem('hjai_user', JSON.stringify(data.user || { email }));
      // Navigate parent window to dashboard
      window.top.location.href = '/dashboard';
    } else {
      throw new Error(data.detail || data.message || 'Invalid credentials. Please try again.');
    }
  } catch (err) {
    errorMsg.textContent = err.message || 'Connection failed. Please check your credentials.';
    errorMsg.style.display = 'block';
    btn.classList.remove('btn-loading');
    btnText.textContent = 'Initiate Connection';
    btnIcon.style.display = 'inline';
    btnSpinner.style.display = 'none';
  }
}
</script>
